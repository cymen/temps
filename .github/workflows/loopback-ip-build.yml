name: Loopback IP backport build

on:
  push:
    branches: [codex/loopback-ip-beta56]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loopback-ip-backport-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      SKIP_WEB_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare build dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev protobuf-compiler clang libclang-dev
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: loopback-ip-beta56-linux
          save-if: ${{ github.ref == 'refs/heads/codex/loopback-ip-beta56' }}
      - name: Check proxy library
        run: cargo check --locked --profile fast --lib -p temps-proxy
      - name: Test loopback and existing Cloudflare resolution
        run: |
          cargo test --locked --profile fast -p temps-proxy --lib client_ip::
          cargo test --locked --profile fast -p temps-proxy --lib cloudflare_ips::
      - name: Build CAPTCHA and console assets
        run: |
          cargo install wasm-pack --version 0.15.0 --locked
          cd web
          bun install --frozen-lockfile
          cd ../crates/temps-captcha-wasm
          bun run build
          cd ../../web
          bun run build
        env:
          RSBUILD_OUTPUT_PATH: ${{ github.workspace }}/crates/temps-cli/dist
          TEMPS_VERSION: v0.1.0-beta.56-loopback-ip
      - name: Build Linux binary
        run: |
          cargo build --locked --profile fast --bin temps
          mkdir -p artifact
          cp target/fast/temps artifact/temps
          strip artifact/temps
          artifact/temps --version
          git rev-parse HEAD > artifact/SOURCE_COMMIT
          cd artifact
          sha256sum temps > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: temps-beta56-loopback-ip-linux-amd64
          path: artifact/
          retention-days: 14
          if-no-files-found: error
